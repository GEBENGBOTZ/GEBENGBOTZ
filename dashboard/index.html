<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GEBENGBOTZ Remote Support</title><style>body{font:16px system-ui;background:#10151d;color:#e8eef7;margin:0;padding:24px}main{max-width:850px;margin:auto}input,button{padding:12px;border-radius:8px;border:1px solid #445;background:#202a38;color:white;margin:5px}button{cursor:pointer}article{background:#1a2431;padding:16px;margin:10px 0;border-radius:12px}.muted{color:#a8b6c8}#log{white-space:pre-wrap;font:13px monospace}</style><main><h1>GEBENGBOTZ Remote Support</h1><p class="muted">Authenticated pairing · device status · explicit diagnostic requests</p><section><input id="url" placeholder="wss://your-host/ws" value="ws://localhost:8000/ws"><input id="code" type="password" placeholder="Pairing code"><button id="connect">Connect</button><span id="state">Disconnected</span></section><h2>Devices</h2><div id="devices"></div><h2>Activity</h2><article id="log">Waiting for connection…</article></main><script>
let ws,devs={};const $=id=>document.getElementById(id);function log(s){$("log").textContent=new Date().toLocaleTimeString()+" "+s+"\\n"+$("log").textContent}
$("connect").onclick=()=>{if(ws)ws.close();ws=new WebSocket($("url").value);ws.onopen=()=>{ws.send(JSON.stringify({type:"HELLO",role:"controller",pairingCode:$("code").value}));$("state").textContent="Connected"};ws.onclose=()=>{$("state").textContent="Disconnected"};ws.onerror=()=>log("Socket error");ws.onmessage=e=>{let m=JSON.parse(e.data);if(m.type==="DEVICES"){devs=m.devices||{};render()}else if(m.type==="RESULT"){log("Response from "+m.deviceId+": "+JSON.stringify(m.result))}else if(m.type==="ERROR")log("Error: "+m.message);else log(JSON.stringify(m))}}
function render(){const d=$("devices");d.innerHTML="";Object.values(devs).forEach(x=>{let a=document.createElement("article");a.innerHTML="<b>"+esc(x.name)+"</b> · "+esc(x.id)+"<p>"+(x.status.battery==null?"Battery unknown":x.status.battery+"%")+" · "+esc(x.status.network||"network unknown")+"</p>";let b=document.createElement("button");b.textContent="Request status";b.onclick=()=>ws&&ws.readyState===1&&ws.send(JSON.stringify({type:"REQUEST_STATUS",deviceId:x.id,requestId:crypto.randomUUID()}));a.appendChild(b);d.appendChild(a)})}function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
</script></html>
